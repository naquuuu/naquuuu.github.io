<body class="fa" data-mode="systems" data-fa-page="booklet">
<script>
  (function () {
    try {
      var mode = localStorage.getItem('naquuuu_mode');
      if (mode === 'culture' || mode === 'systems') document.body.setAttribute('data-mode', mode);
      if (sessionStorage.getItem('naquuuu_fa_booklet') === '1') {
        document.documentElement.setAttribute('data-fa-unlocked', '1');
      }
    } catch (err) {}
  })();
</script>
