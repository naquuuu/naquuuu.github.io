name: Blog Reliability & Sanitization QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs every Saturday at 11:00 AM JKT (04:00 AM UTC)
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gates:
    name: Enforce Blog Reliability & Sanitization Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Blog Reliability QA Gate (All 6 Gates)
        run: |
          python scripts/verify_blog_qa.py

      - name: Run Corporate Sanitization & PII Linter
        run: |
          python scripts/verify_sanitization.py
