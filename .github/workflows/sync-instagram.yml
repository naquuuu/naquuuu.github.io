name: Sync Instagram Dossier Feed

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (11:00 AM WIB)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-feed:
    name: Verify & Sync Instagram Dossier Feed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify & Sync Feed Assets
        run: |
          python scripts/sync_instagram.py

      - name: Commit Updated Feed Registry (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(instagram): automated sync of sartorial feed registry"
            git push
          fi
