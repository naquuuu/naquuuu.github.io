<!doctype html>
<html lang="en">
<head>

<title>jatuh blueprint</title>
<style>
  :root {
    --paper: #f4efe4; --sheet: #fbf8f1; --ink: #2f2d2a; --slate: #4f5b66;
    --terra: #b4573b; --sage: #6f8466; --hair: #cfc6b4; --mute: #8a8378;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: "Helvetica Neue", Arial, system-ui, sans-serif; }
  header { max-width: 1188px; margin: 0 auto; padding: 32px 16px 8px; }
  header h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--mute); font-size: 14px; }
  figure { max-width: 1188px; margin: 16px auto 32px; padding: 0 16px; }
  svg.sheet { width: 100%; height: auto; display: block; background: var(--sheet);
              border: 1px solid var(--hair); }
  svg text { font-family: "Helvetica Neue", Arial, system-ui, sans-serif; fill: var(--ink); font-size: 13px; }
  svg .mono { font-family: "SF Mono", Consolas, monospace; font-size: 12px; }
  svg .small { font-size: 11px; fill: var(--slate); }
  svg .h { font-size: 15px; font-weight: 600; }
  svg .ink { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  svg .thin { fill: none; stroke: var(--ink); stroke-width: .7; }
  svg .hair { fill: none; stroke: var(--hair); stroke-width: .7; }
  svg .dim { fill: none; stroke: var(--slate); stroke-width: .6; }
  svg .dash { fill: none; stroke: var(--slate); stroke-width: .9; stroke-dasharray: 5 4; }
  svg .terra { stroke: var(--terra); }
  svg .sage { stroke: var(--sage); }
  svg .fill-terra { fill: var(--terra); stroke: none; }
  svg .fill-sage { fill: var(--sage); stroke: none; }
  svg .fill-soft { fill: #efe7d6; stroke: var(--ink); stroke-width: 1; }
  svg .fill-white { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2; }
  svg .w-red { fill: none; stroke: #b03a2e; stroke-width: 2; }
  svg .w-blk { fill: none; stroke: #2f2d2a; stroke-width: 2; }
  svg .w-sda { fill: none; stroke: var(--sage); stroke-width: 2; }
  svg .w-scl { fill: none; stroke: var(--terra); stroke-width: 2; }
  svg .lead { stroke-dasharray: 7 4; }
  svg .hl { stroke: var(--terra); stroke-width: 1.6; }
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; }
    header { display: none; }
    figure { margin: 0; padding: 0; max-width: none; page-break-after: always; }
    svg.sheet { border: none; }
  }
</style>
</head>

<header>
