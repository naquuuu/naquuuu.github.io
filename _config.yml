# ==============================================================================
# naquuuu.github.io — Jekyll Configuration (GitHub Pages Native)
# ==============================================================================

title: "naquuuu"
tagline: "Building systems that don't break when real life gets messy."
description: "Personal portfolio and systems architecture journey of Ramadhana Bhanuharya Krishnamurti (naquuuu)."
url: "https://naquuuu.github.io"
baseurl: ""

# Author metadata
author:
  name: "Ramadhana Bhanuharya Krishnamurti"
  handle: "naquuuu"
  location: "Bandung / Jakarta, Indonesia"
  linkedin: "https://www.linkedin.com/in/rbkrishnamurti/"
  brother_site: "https://bhanuharya.github.io/"

# Build & Markdown Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Permalinks for essays / posts
permalink: /blog/:title/

# GitHub Pages Native Plugins (Whitelisted by GitHub Pages)
# jekyll-feed is disabled: it cannot see hand-authored pages, so feed.xml is
# maintained by hand (2026-10-15, blog IDE round, task B5). jekyll-sitemap stays.
plugins:
  - jekyll-sitemap

# Exclude local scratch files and discontinued revamp context
exclude:
  - _revamp
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

  - scripts
  - drafts
